[project]
name = "phitd"
version = "1.0.0"
description = "Distributional reinforcement learning using characteristic functions"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "jax==0.9.0.1; platform_system != 'Linux'",
    "jax[cuda12]==0.9.0.1; platform_system == 'Linux'",
    "chex==0.1.91",
    "flax==0.12.3",
    "gymnax==0.0.9",
    "craftax==1.5.0",
    "optax==0.2.7",
    "numpy==2.3.5",
    "matplotlib==3.10.8",
    "omegaconf==2.3.0",
    "six==1.17.0",
]
